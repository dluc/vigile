# The web site in website/: its tests, and its publication with GitHub Pages.
#
# The tests run on every pull request, on every push to main, and before every publication. They build the
# site from what the program describes of itself (vigile describe) and from running the program, and look at
# it in a browser.
#
# The site is built and published on every push to main, and when the workflow is started by hand, and only a
# site whose tests passed in the same run is published: a change is public some minutes after it is merged. A
# pull request runs the tests and publishes nothing. The site is served at the address the repository's Pages
# settings give it, where "Source" is "GitHub Actions". More in website/README.md.
#
# Every action is named by the commit it is, in full, with its version beside it: a tag can be moved to other
# code, a commit cannot. To take a newer version, look up the commit of its tag and change both.
name: Web site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing more than to read the code, unless a job says what else it needs.
permissions:
  contents: read

jobs:
  test:
    name: Test the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The tests read the code and nothing else.
    permissions:
      contents: read
    # A newer push to the same branch makes the run for the older one pointless: its tests end, and with them
    # its publication, and the newer one publishes. A run that was started by hand is in a group of its own.
    concurrency:
      group: site-tests-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version of pnpm is the one package.json names in "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The site is made from the vigile program, which this makes.
      - run: pnpm build

      # The browser tests are skipped when no browser is found, which would pass for the wrong reason: make sure
      # the one the runner comes with is there.
      - name: Check that there is a browser for the browser tests
        run: test -x /usr/bin/google-chrome && /usr/bin/google-chrome --version

      - name: Run the tests of the site
        run: node --test website/*.test.mjs
        env:
          VIGILE_TEST_BROWSER: /usr/bin/google-chrome

  build:
    name: Build the site
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # To read the code, and to ask Pages where the site is served.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version of pnpm is the one package.json names in "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The site is made from the vigile program, which this makes.
      - run: pnpm build

      # Says where the site is served: the domain that is set for it in the repository's Pages settings, or the
      # project's path where none is.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The build asks the program to describe itself and starts services through it, on this machine only, to
      # run the examples. It looks at what it wrote and fails on a link or a picture that leads nowhere. It
      # needs no browser: the pictures are files in the repository.
      - name: Build the site for the address it is published at
        run: node website/build.mjs --out website/dist --site-url "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  publish:
    name: Publish it
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # What publishing needs and nothing else: to write the pages, and to say who it is to Pages.
    permissions:
      pages: write
      id-token: write
    # One publication at a time, and one that has begun is let finish: half a site is worse than an older one.
    # Every one that waits keeps its turn: where only one may wait, a late publication of an older commit would
    # take the place of the newest one, and then leave itself out below, so that nothing would be published.
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Publications take their turns one at a time, and not always in the order of the pushes they are for. One
      # that comes to its turn after main has moved on is left out: the publication for the newer commit follows
      # it, or was there before it, and an older site is never put over a newer one.
      - id: current
        name: See whether main is still at this commit
        run: head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1) && test -n "$head" && if [ "$head" = "$GITHUB_SHA" ]; then echo "is=true" >> "$GITHUB_OUTPUT"; else echo "main is at $head, past $GITHUB_SHA, so this publication is left out"; fi

      - id: deployment
        if: steps.current.outputs.is == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
