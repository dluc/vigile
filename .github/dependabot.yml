version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Version updates wait until a release is 21 days old. Security updates are not delayed.
    cooldown:
      default-days: 21
    groups:
      development-dependencies:
        dependency-type: development
      production-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
