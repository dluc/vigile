<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-size="13" role="img" aria-labelledby="access-title access-desc">
<title id="access-title">Who a connection acts as</title>
<desc id="access-desc">A connection that sends a key which is valid acts as the user the key was made for. A connection that sends a key which is not valid is refused. A connection without a key acts as the keyless user, agent1 by default, when the setting auth.keyless_user names one, and is refused when the setting is empty.</desc>
<defs><marker id="access-head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" class="head"/></marker></defs>
<rect x="8" y="112" width="124" height="60" rx="10" class="box"/>
<text x="70" y="138" text-anchor="middle" class="t-strong">A connection</text>
<text x="70" y="157" text-anchor="middle" class="t-small t-muted">MCP, HTTP, page</text>
<path d="M132 130L176 78" class="wire" marker-end="url(#access-head)"/>
<path d="M132 154L176 206" class="wire" marker-end="url(#access-head)"/>
<rect x="178" y="46" width="160" height="58" rx="10" class="box"/>
<text x="258" y="70" text-anchor="middle" class="t-strong">with a key</text>
<text x="258" y="90" text-anchor="middle" class="t-mono t-small t-muted">Bearer vig_…</text>
<rect x="178" y="180" width="160" height="58" rx="10" class="box"/>
<text x="258" y="204" text-anchor="middle" class="t-strong">without a key</text>
<text x="258" y="224" text-anchor="middle" class="t-small t-muted">no header at all</text>
<path d="M338 66L526 40" class="wire" marker-end="url(#access-head)"/>
<path d="M338 86L526 98" class="wire" marker-end="url(#access-head)"/>
<path d="M338 200L526 174" class="wire" marker-end="url(#access-head)"/>
<path d="M338 220L526 232" class="wire" marker-end="url(#access-head)"/>
<text x="432" y="36" text-anchor="middle" class="t-small t-muted">valid</text>
<text x="432" y="112" text-anchor="middle" class="t-small t-muted">not valid</text>
<text x="432" y="170" text-anchor="middle" class="t-mono t-small t-muted">keyless_user = "agent1"</text>
<text x="432" y="246" text-anchor="middle" class="t-mono t-small t-muted">keyless_user = ""</text>
<rect x="528" y="16" width="184" height="46" rx="10" class="box-go"/>
<text x="620" y="36" text-anchor="middle" class="t-small t-go t-strong">acts as the user</text>
<text x="620" y="52" text-anchor="middle" class="t-small">the key was made for</text>
<rect x="528" y="76" width="184" height="46" rx="10" class="box-stop"/>
<text x="620" y="96" text-anchor="middle" class="t-small t-stop t-strong">refused</text>
<text x="620" y="112" text-anchor="middle" class="t-mono t-small">unauthorized</text>
<rect x="528" y="150" width="184" height="46" rx="10" class="box-go"/>
<text x="620" y="170" text-anchor="middle" class="t-small t-go t-strong">acts as agent1</text>
<text x="620" y="186" text-anchor="middle" class="t-small">the keyless user</text>
<rect x="528" y="210" width="184" height="46" rx="10" class="box-stop"/>
<text x="620" y="230" text-anchor="middle" class="t-small t-stop t-strong">refused</text>
<text x="620" y="246" text-anchor="middle" class="t-mono t-small">unauthorized</text>
<text x="8" y="286" class="t-small t-muted">admin always needs its key. A key that is not valid never falls back to the keyless user.</text>
</svg>
