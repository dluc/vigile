<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-size="13" role="img" aria-labelledby="versions-title versions-desc">
<title id="versions-title">Two agents start the same task: one wins, one gets a conflict</title>
<desc id="versions-desc">agent1 and agent2 both read task WEB-005 at version 1. agent1 sets it to in progress, naming version 1: the change is made and the task is at version 2. agent2 then sends the same change, naming version 1, and is refused with a version conflict that carries the task as it is now.</desc>
<defs>
<marker id="versions-head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" class="head"/></marker>
<marker id="versions-go" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" class="head-go"/></marker>
<marker id="versions-stop" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" class="head-stop"/></marker>
</defs>
<path d="M90 50V318M360 50V318M630 50V318" class="wire-dash"/>
<rect x="30" y="12" width="120" height="38" rx="19" class="box"/>
<text x="90" y="36" text-anchor="middle" class="t-mono t-strong">agent1</text>
<rect x="290" y="12" width="140" height="38" rx="9" class="box-ink"/>
<text x="360" y="36" text-anchor="middle" class="t-strong t-ink">Vigile</text>
<rect x="570" y="12" width="120" height="38" rx="19" class="box"/>
<text x="630" y="36" text-anchor="middle" class="t-mono t-strong">agent2</text>
<text x="225" y="78" text-anchor="middle" class="t-small">get WEB-005</text>
<path d="M90 86H356" class="wire" marker-end="url(#versions-head)"/>
<text x="495" y="78" text-anchor="middle" class="t-small">get WEB-005</text>
<path d="M630 86H364" class="wire" marker-end="url(#versions-head)"/>
<text x="225" y="110" text-anchor="middle" class="t-small t-muted">open, version 1</text>
<path d="M360 118H94" class="wire-dash" marker-end="url(#versions-head)"/>
<text x="495" y="110" text-anchor="middle" class="t-small t-muted">open, version 1</text>
<path d="M360 118H626" class="wire-dash" marker-end="url(#versions-head)"/>
<text x="225" y="158" text-anchor="middle" class="t-small">start it, based on <tspan class="t-strong">version 1</tspan></text>
<path d="M90 166H356" class="wire" marker-end="url(#versions-head)"/>
<text x="225" y="190" text-anchor="middle" class="t-small t-go t-strong">done: in progress, version 2</text>
<path d="M360 198H94" class="wire-go" marker-end="url(#versions-go)"/>
<rect x="376" y="170" width="150" height="28" rx="6" class="box-sunk"/>
<text x="451" y="189" text-anchor="middle" class="t-small t-muted">WEB-005 is at version 2</text>
<text x="495" y="238" text-anchor="middle" class="t-small">start it, based on <tspan class="t-strong">version 1</tspan></text>
<path d="M630 246H364" class="wire" marker-end="url(#versions-head)"/>
<text x="495" y="270" text-anchor="middle" class="t-small t-stop t-strong">version_conflict</text>
<path d="M360 278H626" class="wire-stop" marker-end="url(#versions-stop)"/>
<text x="495" y="298" text-anchor="middle" class="t-small t-muted">with the task as it is now:</text>
<text x="495" y="314" text-anchor="middle" class="t-small t-muted">in progress, version 2, agent1</text>
</svg>
